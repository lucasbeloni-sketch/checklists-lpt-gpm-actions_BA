name: Backfill dias perdidos (manual)

# Só manual. Dois usos, os dois pontuais:
#
#  1. CARGA INICIAL da base (a pasta nasce vazia): rode `npm run meses` local pra
#     gerar a lista de dias e cole no input "dias". Cada item e o ULTIMO dia de um
#     mes, e o backfill exporta 01/mm ate ele — ou seja, o mes inteiro, gravado em
#     mm.aaaa.csv. Va em lotes de ~12 meses: cada mes e um export no GPM.
#  2. Recuperar buraco pontual depois (dias que ficaram sem registro).
#
# Ver README > "Carga inicial da base" e "Backfill de dias faltando".
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Dias (dd/mm/aaaa, virgula). Pra carga inicial use o ULTIMO dia de cada mes (npm run meses). Vazio = buracos detectados na pasta.'
        type: string
        default: ""
      saida:
        description: 'Modo dias recuperados: nome do CSV NOVO onde juntar os dias (ex. dias_recuperados_2023-2025.csv). Vazio = mexe nos arquivos existentes.'
        type: string
        default: ""
      dry_run:
        description: "Ensaio: exporta e mostra o que mudaria, sem gravar no Drive"
        type: boolean
        default: true

permissions:
  contents: read

# Mesmo grupo do workflow diario: os dois escrevem nos mesmos arquivos do Drive,
# nao podem rodar ao mesmo tempo.
concurrency:
  group: checklists-lpt-ba
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Cada dia e um export no GPM; 31 dias levam bem mais que os 20min do diario.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm install

      - name: Testes unitarios
        run: npm test

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # Escopo primeiro: le so o Drive e lista os buracos, sem tocar no GPM.
      - name: Escopo - dias faltando na pasta
        run: npm run faltantes
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Backfill
        shell: bash
        run: set -o pipefail; npm run backfill 2>&1 | tee backfill.log
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GPM_BA_USER: ${{ secrets.GPM_BA_USER }}
          GPM_BA_PASS: ${{ secrets.GPM_BA_PASS }}
          GPM_USER: ${{ secrets.GPM_USER }}
          GPM_PASS: ${{ secrets.GPM_PASS }}
          DIAS: ${{ inputs.dias }}
          SAIDA: ${{ inputs.saida }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      # O manifesto (dia;arquivo;status;linhas) fica no log; sobe sempre, mesmo
      # se um dia falhou no meio — e o registro de o que entrou e o que nao.
      - name: Upload log + manifesto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-log
          path: backfill.log
          if-no-files-found: warn
          retention-days: 30

      # Em modo SAIDA cada dia e um export no GPM: guardamos os CSVs brutos
      # sempre, pra nao precisar reexportar tudo se a juncao precisar de ajuste.
      - name: Upload exports brutos + debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
